[project]
name = "project-name"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "ty>=0.0.107",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tools"]
# pre-commit はファイル名を直接渡すので、これが無いと extend-exclude が効かない
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 日本語の全角文字（括弧・句読点）を docstring やコメントに書くため無効にする
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

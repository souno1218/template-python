repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: okf-validate
        name: OKF bundle validation
        entry: uv run python tools/okf/validate.py .okf --strict
        language: system
        pass_filenames: false
        files: ^\.okf/
